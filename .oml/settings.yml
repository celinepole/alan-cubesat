# oml-code settings
oml-code:
  schemaVersion: 1

# project npm settings
project:
  name: "@celinepole/alan-method"
  version: 0.1.0
  title: ALAN Method
  description: The ALAN CubeSat modeling method (vocabulary, editor templates, RVM generator).

# source folders
sources:
  - src

# packing settings
pack:
  - include: [src/method]

# oml-cli parameter defaults
defaults:
  export: -o build/owl
  reason: -o build/owl -t
  render: -m src/model/md -b build/web -c src/model/oml/example.com/project/bundle.oml
  pack: -o build/dist